	<!-- 全屏功能 -->
<script>
    function openFullscreen(targetId) {
        const overlay = document.getElementById('fullscreenOverlay');
        const contentBox = document.getElementById('fullscreenContent');
        const targetNode = document.getElementById(targetId);

        if (!targetNode) return;

        const clonedNode = targetNode.cloneNode(true);

        const innerBtns = clonedNode.querySelectorAll('[onclick^="openFullscreen"]');
        innerBtns.forEach(btn => {
            btn.style.display = 'none'; 
        });

        contentBox.innerHTML = '';

        clonedNode.style.width = '100%';
        clonedNode.style.height = '100%';
        clonedNode.style.flex = 'unset';
        clonedNode.style.border = 'none';
        clonedNode.style.borderRadius = '0';
        clonedNode.style.background = '#fff';

        contentBox.appendChild(clonedNode);

        overlay.style.display = 'flex';
    }

    function closeFullscreen() {
        const overlay = document.getElementById('fullscreenOverlay');
        const contentBox = document.getElementById('fullscreenContent');
        
        overlay.style.display = 'none';

        setTimeout(() => {
            contentBox.innerHTML = ''; 
        }, 200); 
    }

    document.getElementById('fullscreenOverlay').addEventListener('click', function(e) {
        if (e.target === this) {
            closeFullscreen();
        }
    });
</script>
